[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pco"
version = "0.1.0"
description = "PCO personal cognitive OS and its profile-neutral memory core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "json-repair>=0.61.7,<0.62",
  "pydantic>=2.10",
  "pymilvus[milvus-lite]>=3.0",
  "PyYAML>=6.0",
  "tantivy>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
mem = "mem_core.cli:main"
pco = "pco.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_core", "src/pco"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["milvus: requires a local loopback port for Milvus Lite"]

[tool.coverage.run]
branch = true
source = ["mem_core", "pco"]
