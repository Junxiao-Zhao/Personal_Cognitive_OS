# Dev workspace tool configuration only.
# Distributions live in:
#   packages/mem-core  -> mem-core (mem_core package)
#   packages/pco       -> pco (pco package)
#
# Install for development:
#   python -m pip install -e packages/mem-core
#   python -m pip install -e 'packages/pco[dev]'

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["packages/mem-core/src", "packages/pco/src"]
markers = ["milvus: requires a local loopback port for Milvus Lite"]

[tool.coverage.run]
branch = true
source = ["mem_core", "pco"]
