name: pco
version: 0.5.0
application_commit_policy: pco_proposal
streams:
  evidence:
    path: evidence/evidence.jsonl
    schema: schemas/evidence.schema.json
    schema_version: pco/evidence/v1
    write_policy: auto
  sources:
    path: sources/sources.jsonl
    schema: schemas/source.schema.json
    schema_version: pco/source/v1
    write_policy: auto
  events:
    path: events/events.jsonl
    schema: schemas/event.schema.json
    schema_version: pco/event/v1
    write_policy: auto
  psychologies:
    path: psychologies/psychologies.jsonl
    schema: schemas/concept.schema.json
    schema_version: pco/psychology/v1
    write_policy: auto
  philosophies:
    path: philosophies/philosophies.jsonl
    schema: schemas/concept.schema.json
    schema_version: pco/philosophy/v1
    write_policy: auto
  archetypes:
    path: archetypes/archetypes.jsonl
    schema: schemas/archetype.schema.json
    schema_version: pco/archetype/v1
    write_policy: auto
  hypotheses:
    path: hypotheses/hypotheses.jsonl
    schema: schemas/hypothesis.schema.json
    schema_version: pco/hypothesis/v1
    write_policy: auto
  meta_revisions:
    path: meta_revisions/meta_revisions.jsonl
    schema: schemas/meta-revision.schema.json
    schema_version: pco/meta-revision/v1
    write_policy: auto
  session_handoffs:
    path: session_handoffs/session_handoffs.jsonl
    schema: schemas/session-handoff.schema.json
    schema_version: pco/session-handoff/v1
    write_policy: auto
artifact_roots:
  - source_blobs
validators:
  - pco.validate
