[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pco"
version = "0.5.0"
description = "PCO personal cognitive OS built on the profile-neutral mem-core"
requires-python = ">=3.11"
dependencies = [
  "mem-core>=0.5.0,<0.6.0",
  "jsonschema>=4.23",
  "packaging>=24",
  "pydantic>=2.10",
  "pymilvus[milvus-lite]>=3.0",
  "PyYAML>=6.0",
  "tantivy>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
pco = "pco.cli:main"

[project.entry-points."mem_core.capabilities"]
"pco.validate" = "pco.validation:validate_profile"
"pco.retrieval.search" = "pco.retrieval:search"

[tool.hatch.build.targets.wheel]
packages = ["src/pco"]
